name: Postal Memories iOS - FIRST IPA v2 MAC BUILD

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/postal-memories-ios.yml"

permissions:
  contents: read
  actions: read

jobs:
  recover_project:
    name: 1. Recover Postal Memories Unity project
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work tools recovered output postal-recovered.tar.gz
          mkdir -p work tools recovered output

          for cmd in curl jq unzip strings gh python3 tar; do
            command -v "$cmd" >/dev/null || {
              echo "ERROR: missing tool: $cmd"
              exit 1
            }
          done

      - name: Download APK from newest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$(gh release list --limit 1 --json tagName --jq '.[0].tagName')"

          if [ -z "$TAG" ]; then
            echo "ERROR: No GitHub Release exists."
            echo "Upload Postal Memories Android.apk to a Release first."
            exit 1
          fi

          echo "Using release: $TAG"
          mkdir -p work/release

          gh release download "$TAG" \
            --dir work/release \
            --pattern "*.apk"

          APK="$(
            find work/release -type f -iname '*.apk' -printf '%s %p\n' \
              | sort -nr \
              | head -1 \
              | cut -d' ' -f2-
          )"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "ERROR: APK not found in newest Release."
            exit 1
          fi

          cp "$APK" work/PostalMemories.apk
          ls -lh work/PostalMemories.apk

      - name: Extract APK and locate Unity data
        id: inspect
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p work/android
          unzip -q work/PostalMemories.apk -d work/android

          DATA_DIR=""

          GGM="$(find work/android -type f -name globalgamemanagers -print | head -1 || true)"
          if [ -n "$GGM" ]; then
            DATA_DIR="$(dirname "$GGM")"
          fi

          if [ -z "$DATA_DIR" ] && [ -d work/android/assets/bin/Data ]; then
            DATA_DIR="work/android/assets/bin/Data"
          fi

          if [ -z "$DATA_DIR" ]; then
            DATA_UNITY3D="$(find work/android -type f -name data.unity3d -print | head -1 || true)"
            if [ -n "$DATA_UNITY3D" ]; then
              DATA_DIR="$(dirname "$DATA_UNITY3D")"
            fi
          fi

          if [ -z "$DATA_DIR" ] || [ ! -d "$DATA_DIR" ]; then
            echo "ERROR: Unity Data directory not found."
            find work/android -maxdepth 5 -type f | head -400
            exit 1
          fi

          VERSION=""
          if [ -f "$DATA_DIR/data.unity3d" ]; then
            VERSION="$(
              strings "$DATA_DIR/data.unity3d" 2>/dev/null \
                | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
                | head -1 || true
            )"
          fi

          if [ -z "$VERSION" ]; then
            while IFS= read -r f; do
              CANDIDATE="$(
                strings "$f" 2>/dev/null \
                  | grep -Eo '20[0-9]{2}\.[0-9]+\.[0-9]+[abfp][0-9]+' \
                  | head -1 || true
              )"
              if [ -n "$CANDIDATE" ]; then
                VERSION="$CANDIDATE"
                break
              fi
            done < <(find "$DATA_DIR" -maxdepth 2 -type f -size -64M -print)
          fi

          echo "DATA_DIR=$DATA_DIR"
          echo "UNITY_VERSION=$VERSION"

          if [ "$VERSION" != "2023.2.20f1" ]; then
            echo "ERROR: Expected Unity 2023.2.20f1, got: ${VERSION:-UNKNOWN}"
            exit 1
          fi

          echo "$DATA_DIR" > output/unity-data-dir.txt
          echo "unity_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download AssetRipper 2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh api repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' \
            > output/assetripper-assets.txt

          ASSET="$(
            grep -Ei '^AssetRipper_linux_(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
              output/assetripper-assets.txt \
              | head -1 || true
          )"

          if [ -z "$ASSET" ]; then
            ASSET="$(
              grep -Ei 'linux.*(x64|amd64|64).*(\.tar\.xz|\.zip)$' \
                output/assetripper-assets.txt \
                | head -1 || true
            )"
          fi

          if [ -z "$ASSET" ]; then
            echo "ERROR: AssetRipper Linux package not found."
            cat output/assetripper-assets.txt
            exit 1
          fi

          gh release download 2.0.0 \
            -R AssetRipper/AssetRipper \
            -p "$ASSET" \
            -D tools

          mkdir -p tools/assetripper

          case "tools/$ASSET" in
            *.tar.xz) tar -xJf "tools/$ASSET" -C tools/assetripper ;;
            *.zip) unzip -q "tools/$ASSET" -d tools/assetripper ;;
            *) echo "ERROR: unsupported AssetRipper archive"; exit 1 ;;
          esac

          RIPPER="$(
            find tools/assetripper -type f \
              \( -name AssetRipper.GUI.Free -o -name AssetRipper.GUI -o -name AssetRipper \) \
              | head -1
          )"

          if [ -z "$RIPPER" ]; then
            echo "ERROR: AssetRipper executable not found."
            exit 1
          fi

          chmod +x "$RIPPER"
          echo "$RIPPER" > output/assetripper-path.txt

      - name: Recover Unity project
        shell: bash
        run: |
          set -euo pipefail

          RIPPER="$(cat output/assetripper-path.txt)"
          DATA_DIR="$(cat output/unity-data-dir.txt)"
          PORT=3333
          EXPORT_DIR="$PWD/recovered/PostalMemories"

          mkdir -p "$EXPORT_DIR"

          "$RIPPER" --headless --port "$PORT" \
            > output/assetripper.log 2>&1 &
          PID=$!

          READY=0
          for i in $(seq 1 90); do
            if curl -fsS "http://127.0.0.1:${PORT}/" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: AssetRipper did not start."
            tail -250 output/assetripper.log || true
            exit 1
          fi

          LOAD_CODE="$(
            curl -sS \
              -o output/load-response.txt \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$DATA_DIR" \
              "http://127.0.0.1:${PORT}/LoadFolder"
          )"

          echo "LOAD_HTTP=$LOAD_CODE"

          if [ "$LOAD_CODE" != "200" ] && [ "$LOAD_CODE" != "302" ]; then
            cat output/load-response.txt || true
            tail -250 output/assetripper.log || true
            exit 1
          fi

          EXPORT_CODE="$(
            curl -sS \
              -o output/export-response.txt \
              -w '%{http_code}' \
              -H 'Content-Type: application/x-www-form-urlencoded' \
              --data-urlencode "Path=$EXPORT_DIR" \
              --data-urlencode 'CreateSubfolder=false' \
              "http://127.0.0.1:${PORT}/Export/UnityProject"
          )"

          echo "EXPORT_HTTP=$EXPORT_CODE"

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          if [ "$EXPORT_CODE" != "200" ] && [ "$EXPORT_CODE" != "302" ]; then
            cat output/export-response.txt || true
            tail -250 output/assetripper.log || true
            exit 1
          fi

          PROJECT=""
          if [ -d "$EXPORT_DIR/ExportedProject/Assets" ]; then
            PROJECT="$EXPORT_DIR/ExportedProject"
          elif [ -d "$EXPORT_DIR/Assets" ]; then
            PROJECT="$EXPORT_DIR"
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: recovered project not found."
            find "$EXPORT_DIR" -maxdepth 4 -type d | head -300
            exit 1
          fi

          echo "$PROJECT" > output/project-path.txt
          echo "PROJECT=$PROJECT"
          echo "SCENES=$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l)"
          echo "SCRIPTS=$(find "$PROJECT/Assets" -type f -name '*.cs' | wc -l)"

      - name: Prepare recovered project for iOS
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(cat output/project-path.txt)"

          echo "===== REMOVE ANDROID-ONLY FILES ====="
          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' \) \
            -print \
            | tee output/removed-android-files.txt || true

          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' \) \
            -delete || true

          rm -rf "$PROJECT/Assets/Plugins/Android" || true
          rm -rf "$PROJECT/Library" "$PROJECT/Temp" "$PROJECT/obj" || true

          mkdir -p "$PROJECT/ProjectSettings"
          printf 'm_EditorVersion: 2023.2.20f1\n' \
            > "$PROJECT/ProjectSettings/ProjectVersion.txt"

          mkdir -p "$PROJECT/Assets/Editor"

          cat > "$PROJECT/Assets/Editor/PostalMemoriesIOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class PostalMemoriesIOSBuild
          {
              public static void PerformBuild()
              {
                  string[] scenes = EditorBuildSettings.scenes
                      .Where(s => s != null && s.enabled && !string.IsNullOrWhiteSpace(s.path))
                      .Select(s => s.path)
                      .Where(IsValidScene)
                      .Distinct()
                      .ToArray();

                  if (scenes.Length == 0)
                  {
                      scenes = AssetDatabase.FindAssets("t:Scene", new[] { "Assets" })
                          .Select(AssetDatabase.GUIDToAssetPath)
                          .Where(IsValidScene)
                          .Distinct()
                          .OrderBy(p => p)
                          .ToArray();
                  }

                  if (scenes.Length == 0)
                      throw new Exception("No valid Unity scenes were recovered.");

                  Debug.Log("POSTAL MEMORIES IOS SCENES: " + scenes.Length);
                  foreach (string scene in scenes)
                      Debug.Log("SCENE: " + scene);

                  EditorBuildSettings.scenes = scenes
                      .Select(p => new EditorBuildSettingsScene(p, true))
                      .ToArray();

                  string output = Path.GetFullPath(
                      Path.Combine(Application.dataPath, "../../build/iOS/PostalMemories-iOS")
                  );

                  if (Directory.Exists(output))
                      Directory.Delete(output, true);
                  Directory.CreateDirectory(output);

                  PlayerSettings.SetScriptingBackend(
                      BuildTargetGroup.iOS,
                      ScriptingImplementation.IL2CPP
                  );

                  PlayerSettings.applicationIdentifier =
                      "com.postalmemories.ios.port";

                  PlayerSettings.iOS.targetOSVersionString = "15.0";

                  BuildPlayerOptions options = new BuildPlayerOptions
                  {
                      scenes = scenes,
                      locationPathName = output,
                      target = BuildTarget.iOS,
                      options = BuildOptions.CleanBuildCache
                  };

                  BuildReport report = BuildPipeline.BuildPlayer(options);

                  Debug.Log("POSTAL MEMORIES IOS RESULT: " + report.summary.result);
                  Debug.Log("POSTAL MEMORIES IOS ERRORS: " + report.summary.totalErrors);
                  Debug.Log("POSTAL MEMORIES IOS WARNINGS: " + report.summary.totalWarnings);

                  if (report.summary.result != BuildResult.Succeeded)
                      throw new Exception(
                          "Postal Memories iOS build failed: " + report.summary.result +
                          ", errors=" + report.summary.totalErrors
                      );
              }

              private static bool IsValidScene(string path)
              {
                  if (string.IsNullOrWhiteSpace(path))
                      return false;

                  string normalized = path.Replace('\\', '/');

                  if (!normalized.EndsWith(".unity", StringComparison.OrdinalIgnoreCase))
                      return false;

                  SceneAsset asset = AssetDatabase.LoadAssetAtPath<SceneAsset>(normalized);
                  if (asset != null)
                      return true;

                  string root = Directory.GetParent(Application.dataPath).FullName;
                  return File.Exists(Path.Combine(root, normalized));
              }
          }
          CS

          echo "===== PROJECT READY ====="
          cat "$PROJECT/ProjectSettings/ProjectVersion.txt"
          find "$PROJECT/Assets" -type f -name '*.unity' | head -100

      - name: Pack recovered Unity project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT="$(cat output/project-path.txt)"
          tar -czf postal-recovered.tar.gz -C "$PROJECT" .
          ls -lh postal-recovered.tar.gz

      - name: Upload recovered Unity project
        uses: actions/upload-artifact@v4
        with:
          name: Postal-Memories-Recovered-Unity-v2
          path: postal-recovered.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Upload recovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postal-Memories-Recovery-Diagnostics-v2
          path: output
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  build_ipa:
    name: 2. Build Xcode on macOS + Make unsigned IPA
    needs: recover_project
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download recovered Unity project
        uses: actions/download-artifact@v4
        with:
          name: Postal-Memories-Recovered-Unity-v2
          path: recovered-download

      - name: Extract recovered project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf recovered-project build DerivedData output
          mkdir -p recovered-project build output

          tar -xzf recovered-download/postal-recovered.tar.gz \
            -C recovered-project

          echo "===== RECOVERED PROJECT ====="
          cat recovered-project/ProjectSettings/ProjectVersion.txt
          find recovered-project/Assets -type f -name '*.unity' | head -100

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Activate Unity Personal on macOS
        uses: RageAgainstThePixel/activate-unity-license@v2
        with:
          license: Personal
          username: ${{ secrets.UNITY_USERNAME }}
          password: ${{ secrets.UNITY_PASSWORD }}
          license-version: 6.x

      - name: Install official Unity CLI
        shell: bash
        run: |
          set -euo pipefail

          export UNITY_CLI_HOME="$PWD/tools/unity-official-cli"
          export UNITY_CLI_CHANNEL="beta"
          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          rm -rf "$UNITY_CLI_HOME"
          mkdir -p "$UNITY_CLI_HOME"

          curl -fsSL --retry 5 --retry-delay 3 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            -o /tmp/unity-cli-install.sh

          bash /tmp/unity-cli-install.sh

          echo "$UNITY_CLI_HOME/bin" >> "$GITHUB_PATH"

          UNITY="$UNITY_CLI_HOME/bin/unity"
          if [ ! -x "$UNITY" ]; then
            echo "ERROR: official Unity CLI was not installed."
            find "$UNITY_CLI_HOME" -maxdepth 4 -type f -print || true
            exit 1
          fi

          "$UNITY" --version

      - name: Install Unity 2023.2.20f1 + iOS module on macOS
        shell: bash
        run: |
          set -euo pipefail

          UNITY="$PWD/tools/unity-official-cli/bin/unity"
          INSTALL_ROOT="$HOME/UnityEditors"
          VERSION="2023.2.20f1"
          CHANGESET="0e25a174756c"

          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1

          mkdir -p "$INSTALL_ROOT"

          "$UNITY" --non-interactive --no-banner --no-color \
            editors install-path --set "$INSTALL_ROOT"

          "$UNITY" --non-interactive --no-banner --no-color \
            install "$VERSION" \
            --changeset "$CHANGESET" \
            --module ios \
            --no-child-modules \
            --yes \
            --accept-eula \
            2>&1 | tee output/unity-install-macos.log

          UNITY_BIN="$(
            find "$INSTALL_ROOT" -type f \
              -path '*/Unity.app/Contents/MacOS/Unity' \
              -print \
              | head -1
          )"

          if [ -z "$UNITY_BIN" ] || [ ! -x "$UNITY_BIN" ]; then
            echo "ERROR: Unity.app executable not found."
            find "$INSTALL_ROOT" -maxdepth 6 -print | head -500
            exit 1
          fi

          echo "$UNITY_BIN" > output/unity-bin.txt
          echo "UNITY_BIN=$UNITY_BIN"

          UNITY_APP_ROOT="$(dirname "$(dirname "$(dirname "$UNITY_BIN")")")"
          echo "UNITY_APP_ROOT=$UNITY_APP_ROOT"

          if [ ! -d "$UNITY_APP_ROOT/Contents/PlaybackEngines/iOSSupport" ]; then
            echo "ERROR: iOSSupport module is missing."
            find "$UNITY_APP_ROOT/Contents/PlaybackEngines" -maxdepth 3 -print || true
            exit 1
          fi

      - name: Build iOS Xcode project on macOS
        id: unity_build
        shell: bash
        run: |
          set -o pipefail

          UNITY_BIN="$(cat output/unity-bin.txt)"
          PROJECT="$PWD/recovered-project"

          echo "===== UNITY BUILD ON macOS ====="
          echo "UNITY_BIN=$UNITY_BIN"
          echo "PROJECT=$PROJECT"

          "$UNITY_BIN" \
            -batchmode \
            -nographics \
            -quit \
            -projectPath "$PROJECT" \
            -buildTarget iOS \
            -executeMethod PostalMemoriesIOSBuild.PerformBuild \
            -logFile - \
            2>&1 | tee output/unity-build-macos.log

          RC=${PIPESTATUS[0]}
          echo "UNITY_EXIT=$RC"
          exit "$RC"

      - name: Locate Xcode project
        shell: bash
        run: |
          set -euo pipefail

          XCODE_DIR="$PWD/build/iOS/PostalMemories-iOS"

          if [ ! -d "$XCODE_DIR" ]; then
            XCODE_DIR="$(
              find "$PWD/build" -type d -name '*.xcodeproj' -print 2>/dev/null \
                | head -1 \
                | xargs -r dirname
            )"
          fi

          if [ -z "$XCODE_DIR" ] || [ ! -d "$XCODE_DIR" ]; then
            echo "ERROR: Xcode output directory not found."
            find "$PWD/build" -maxdepth 6 -print | head -500 || true
            exit 1
          fi

          PROJ="$(find "$XCODE_DIR" -maxdepth 2 -type d -name '*.xcodeproj' | head -1)"
          WORKSPACE="$(find "$XCODE_DIR" -maxdepth 2 -type d -name '*.xcworkspace' | head -1 || true)"

          if [ -z "$PROJ" ]; then
            echo "ERROR: .xcodeproj not found."
            find "$XCODE_DIR" -maxdepth 4 -print | head -500
            exit 1
          fi

          echo "$XCODE_DIR" > output/xcode-dir.txt
          echo "$PROJ" > output/xcode-project.txt
          echo "$WORKSPACE" > output/xcode-workspace.txt

          echo "XCODE_DIR=$XCODE_DIR"
          echo "PROJ=$PROJ"
          echo "WORKSPACE=${WORKSPACE:-NONE}"

          xcodebuild -project "$PROJ" -list

          echo "===== IL2CPP HOST TOOL CHECK ====="
          find "$XCODE_DIR/Il2CppOutputProject" \
            -type f -name il2cpp -print 2>/dev/null || true

      - name: Build Unity-iPhone unsigned app
        shell: bash
        run: |
          set -o pipefail

          PROJ="$(cat output/xcode-project.txt)"
          WORKSPACE="$(cat output/xcode-workspace.txt)"

          rm -rf DerivedData

          COMMON_ARGS=(
            -scheme Unity-iPhone
            -configuration Release
            -sdk iphoneos
            -destination "generic/platform=iOS"
            -derivedDataPath "$PWD/DerivedData"
            ARCHS=arm64
            ONLY_ACTIVE_ARCH=NO
            IPHONEOS_DEPLOYMENT_TARGET=15.0
            PRODUCT_BUNDLE_IDENTIFIER=com.postalmemories.ios.port
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=
            DEVELOPMENT_TEAM=
            ENABLE_BITCODE=NO
          )

          if [ -n "$WORKSPACE" ] && [ -d "$WORKSPACE" ]; then
            echo "BUILDING WORKSPACE: $WORKSPACE"
            xcodebuild \
              -workspace "$WORKSPACE" \
              "${COMMON_ARGS[@]}" \
              build \
              2>&1 | tee output/xcodebuild.log
          else
            echo "BUILDING PROJECT: $PROJ"
            xcodebuild \
              -project "$PROJ" \
              "${COMMON_ARGS[@]}" \
              build \
              2>&1 | tee output/xcodebuild.log
          fi

          RC=${PIPESTATUS[0]}
          exit "$RC"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          APP="$(
            find DerivedData/Build/Products \
              -type d -name '*.app' \
              -path '*Release-iphoneos*' \
              | head -1
          )"

          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "ERROR: built .app not found."
            find DerivedData/Build/Products -maxdepth 6 -print | head -500
            exit 1
          fi

          echo "APP=$APP"

          rm -rf output/Payload
          mkdir -p output/Payload
          cp -R "$APP" output/Payload/PostalMemories.app

          cd output
          /usr/bin/zip -qry Postal-Memories-iOS-v2-UNSIGNED.ipa Payload
          rm -rf Payload

          ls -lh Postal-Memories-iOS-v2-UNSIGNED.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Postal-Memories-iOS-v2-Signulous
          path: |
            output/Postal-Memories-iOS-v2-UNSIGNED.ipa
            output/xcodebuild.log
            output/unity-build-macos.log
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload macOS diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Postal-Memories-iOS-v2-Mac-Diagnostics
          path: output
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
